<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="refresh" content="0; url=./terminal.html" />
        <title>Trading Desk</title>
        <script>
            window.location.replace('./terminal.html');
        </script>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #090d16;
                color: #94a3b8;
                font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .loading {
                text-align: center;
            }
            .spinner {
                width: 24px;
                height: 24px;
                border: 2px solid #28354e;
                border-top-color: #3b82f6;
                border-radius: 50%;
                animation: spin 800ms linear infinite;
                margin: 0 auto 12px;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </head>
    <body>
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading Indian Market Terminal…</p>
        </div>
    </body>
</html>
